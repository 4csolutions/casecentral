# Gemini Code Assist configuration for custom_4cs
# Docs: https://developers.google.com/gemini-code-assist/docs/customize-gemini-behavior

code_review:
  # Automatically review every pull request
  comment_severity_threshold: WARNING  # Only post COMMENT, WARNING, or ERROR level findings

  # Ignore generated/migrated files that don't need review
  exclude_patterns:
    - "**/*.json"          # DocType JSON definitions — auto-generated by Frappe bench
    - "**/*.min.js"        # Minified JS
    - "**/migrations/**"   # Database migration files
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "**/node_modules/**"
    - "**/*.egg-info/**"

  # Pull request summary: Gemini will post a high-level summary on every PR
  pull_request_summary: true

  # -------------------------------------------------------------------------
  # Review checklist — derived from the quality-code-review skill.
  # Priority order: Correctness → Security → Performance → Concurrency →
  # Readability → API design → Testing → Errors & observability.
  # -------------------------------------------------------------------------
  review_style: |
    This is a Frappe Framework / ERPNext custom app (custom_4cs).
    Apply the following checklist on every PR, spending most attention on
    §1 Correctness and §2 Security. Lead findings with the highest-consequence
    issues first. Prefer a root-cause fix over a workaround, and always say
    *why* the finding matters (what breaks, for whom).

    ## §1 Correctness & stability (highest consequence)
    - Fail early and loudly. Use assertions for internal invariants
      (e.g. `assert total_credit == total_debit`). Stateful / accounting /
      compliance code is "failure is not an option" code.
    - Flag every stray `frappe.db.commit()` / `db.rollback()` mid-transaction.
      No partial commits; no sacrificing atomicity for convenience.
    - Flag `set_value`, `db.delete`, or `get_value` calls where the
      name/filter could be `None` or empty — they silently operate on the
      whole table.
    - Never mutate a list/dict while iterating it. Flag any such pattern.
    - Flag mutable default arguments (`def f(items=[])`) — use `None` + guard.
    - Check that type comparisons are explicit (cast with `cint`/`flt` at
      the boundary); mismatched types silently never match or are always true.
    - Question the return shape before indexing: can it be `None` or
      `[None, None]`? Watch `as_dict=1` vs scalar confusion.
    - Flag silent semantic changes to long-standing behavior — they are
      breaking changes in disguise even when no signature changed.

    ## §2 Security
    **Injection**
    - NEVER build SQL by string concatenation/f-strings. Enforce parameterized
      queries (`frappe.db.sql("... where name = %s", (user,))`). Prefer
      `frappe.qb` — raw SQL ties code to one DB engine.
    - Validate input *types* at trust boundaries for every
      `@frappe.whitelist` method — a parameter expected as `str` can arrive as
      `{"key": ["!=", ""]}` and bypass a check. Use explicit `isinstance(key, str)`.
    - Never `eval`/`exec` user input; `safe_eval`/`safe_exec` only, sparingly.

    **Access control**
    - "Think 10 times before `allow_guest=True`." Web pages must apply
      permissions before reading/sharing data. Prefer `get_list`/`get_all`.
    - Scope permission relaxations precisely — not to all non-guest users.

    **Filesystem / path traversal**
    - Prefer the File doctype API. Reject any user input in file paths that
      could traverse outside the site folder (`../../`).

    **Crypto / secrets**
    - Never roll custom crypto. Verify webhook/guest request authenticity (HMAC).
    - Signed/one-time URLs: use a truly secret value; expire by time *and*
      first use; validate using the URL alone (not merged form data).
    - Store secrets in password fields only; never leak them in logs or errors.

    **XSS**
    - Don't inject user input into the DOM. Escape right before injection;
      don't sanitize by discarding special characters.

    ## §3 Performance
    - Common reads < 100 ms; most writes < 5 s; never exceed ~10 s.
    - Frequently-called endpoints must do O(1) or O(log N) work.
    - Flag any WHERE/join/filter on an unindexed column; indexes must be
      committed in code, not applied ad-hoc.
    - Flag N+1 patterns (DB calls inside loops). Cache stable values instead
      of re-querying. Acceptable in background jobs, never in requests.
    - Aggregate in SQL (`SUM`/`COUNT`), not Python. Push filters into the
      subquery before joins.
    - Don't fetch a whole doc for one value — use `get_value`/`set_value`.
    - Move long-running work to `frappe.enqueue(..., queue="long")`.
    - Reorder boolean conditions so the cheap in-memory check is first
      (short-circuit avoids DB call).

    ## §4 Concurrency
    - Check-then-act is a race: `if not frappe.db.exists(): insert()`. Prefer
      a DB-level unique constraint.
    - `SELECT ... FOR UPDATE` on an unindexed column locks every scanned row
      — ensure the filter is indexed.
    - Flag shared mutable class attributes / module-level state that leak
      query context across concurrent requests. Make query-building stateless.

    ## §5 Readability & maintainability
    - Keep functions pure when possible; don't pass mutable objects to be
      filled in — return new values.
    - Prefer the boring construct (a 4-line for-loop) over a clever one-liner.
    - Consistency over personal style; flag deviations from surrounding
      conventions.
    - Use guard clauses (early returns) over deep nesting / if-else soup.
    - Delete dead/commented-out code — git history keeps it.
    - Document public modules/classes/functions with docstrings; prefer type
      annotations over describing types in prose.
    - Split unrelated changes into separate commits/PRs.

    ## §6 API design & backward compatibility
    - Principle of least astonishment: name + signature should convey ~90%
      of intent.
    - Reject loose/overloaded parameters that accept many disjoint types.
    - Build for extension, not override. Never monkey-patch core at runtime.
    - Minor versions = zero breaking changes. Flag: removed public
      functions/fields, reordered args, new mandatory args, changed business
      logic, moved/renamed files, bumped shared deps.
    - Schema breaking-change footguns: adding mandatory fields, making fields
      unique (needs data patch), changing field types without patches, removing
      fields. All need explicit data patches, tested on a populated site.
    - New parameters go last as keyword args with safe defaults (`None`).
    - Data patches must be idempotent, correctly ordered, and in the right app.
    - A modified existing test assertion is a red flag — justify it explicitly.

    ## §7 Testing
    - Each PR needs decent test coverage on the diff (target: 85% diff coverage).
    - Every bug fix needs a regression test.
    - Flag schema changes or data patches that have no migration test on a
      realistic, populated site (empty tables always migrate successfully).
    - Tests must be deterministic and independent: no `random`, no
      cross-test state, use `freeze_time` for time-dependent logic.

    ## §8 Error messages, logging & observability
    - Error titles must be specific and Google-able (never just "Error").
      Reference field names. State what changed with before→after values.
    - Surface failures to the affected party promptly.
    - Preserve tracebacks/exception context in logs. Log destructive/admin
      actions with attributable identity (who, when, from where).

